# ============================================================
# Clínica Dental Alamillo – Configuración
# ============================================================
spring.application.name=clinica-alamillo-api

# -- Servidor --
server.port=8080

# -- Base de datos MariaDB --
spring.datasource.url=jdbc:mariadb://localhost:3306/CAlamillo?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Europe/Madrid
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=toor

# -- JPA / Hibernate --
# 'update' crea las tablas si no existen y actualiza el schema sin borrar datos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Datos iniciales: Hibernate crea tablas primero, luego corre data.sql
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# -- OpenAPI / Swagger UI --
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tryItOutEnabled=true

# -- CORS --
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# ============================================================
# Seguridad (JWT + cifrado de datos de salud)
# ============================================================
# Secreto de firma JWT (HS256). MÍNIMO 32 bytes. En prod: variable de entorno JWT_SECRET.
# El valor por defecto es SOLO para desarrollo local; NUNCA usar en producción.
app.security.jwt-secret=${JWT_SECRET:dev-only-change-me-please-32bytes-minimum-secret-0123456789}
# Vigencia del token en milisegundos (por defecto 24h)
app.security.jwt-expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Clave AES-256 (32 bytes en Base64) para cifrar campos de salud en reposo.
# En prod: variable de entorno HEALTH_ENCRYPTION_KEY desde un gestor de secretos.
# Si se deja vacía, el acceso a campos cifrados fallará de forma explícita (fail-safe).
app.security.health-encryption-key=${HEALTH_ENCRYPTION_KEY:}

# Semilla del administrador inicial (solo se crea si no existe ningún usuario)
app.security.admin-email=${ADMIN_EMAIL:admin@clinicadentalalamillo.com}
app.security.admin-password=${ADMIN_PASSWORD:CambiaEstaClave2026!}

# ============================================================
# Email (Spring Mail) – notificaciones de citas
# ============================================================
# En prod: configura las variables de entorno MAIL_HOST / MAIL_PORT /
# MAIL_USERNAME / MAIL_PASSWORD y pon MAIL_ENABLED=true.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Dirección remitente visible al paciente
app.mail.from=${MAIL_FROM:noreply@clinicadentalalamillo.com}
# Poner a true solo cuando MAIL_USERNAME y MAIL_PASSWORD estén configurados
app.mail.enabled=${MAIL_ENABLED:false}

# ============================================================
# PDF – cabecera de la clínica en presupuestos/facturas
# ============================================================
app.clinic.name=${CLINIC_NAME:Clínica Dental Alamillo}
app.clinic.address=${CLINIC_ADDRESS:Calle Alamillo, XX · Sevilla}
app.clinic.phone=${CLINIC_PHONE:602 45 82 49}
app.clinic.cif=${CLINIC_CIF:B-XXXXXXXX}

# URL pública del frontend (usada en emails de invitación)
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# -- Logging --
logging.level.com.clinicaalamillo=INFO
logging.level.org.springframework.web=WARN
