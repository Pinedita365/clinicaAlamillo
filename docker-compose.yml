services:
  backend:
    build: ./backend
    container_name: clinica_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      HEALTH_ENCRYPTION_KEY: ${HEALTH_ENCRYPTION_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      FRONTEND_URL: https://javierpineda.es/clinicadentalalamillo
      APP_MAIL_ENABLED: ${MAIL_ENABLED:-false}
      SPRING_MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-}

  frontend:
    build: ./frontend
    container_name: clinica_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
