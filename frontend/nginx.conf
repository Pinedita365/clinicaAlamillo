server {
    listen 80;

    # ── API → backend container ──────────────────────────────────────────────
    # Strips /clinicadentalalamillo and forwards /api/... to backend:8080
    location /clinicadentalalamillo/api/ {
        rewrite ^/clinicadentalalamillo(/.*)$ $1 break;
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # ── SPA estática ─────────────────────────────────────────────────────────
    location /clinicadentalalamillo/ {
        alias /usr/share/nginx/html/clinicadentalalamillo/;
        index index.html;
        try_files $uri $uri/ /clinicadentalalamillo/index.html;
    }

    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
